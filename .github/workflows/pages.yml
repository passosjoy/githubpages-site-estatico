name: Validar e publicar site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio: só o necessário para publicar via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validar HTML e links internos
        run: python3 scripts/check_site.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Desligado neste repo (é uma prova técnica). Para publicar na sua cópia, crie a
  # variável de repositório ENABLE_PAGES=true e ative Settings → Pages → Source: GitHub Actions.
  deploy:
    if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
